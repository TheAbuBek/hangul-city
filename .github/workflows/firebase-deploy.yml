name: Deploy to Firebase Hosting
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then echo "::error::Secret FIREBASE_SERVICE_ACCOUNT is missing"; exit 1; fi
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          set +e
          npx --yes firebase-tools@13 deploy --only hosting --project hangul-city --non-interactive > out.txt 2>&1
          code=$?
          cat out.txt
          if [ $code -ne 0 ]; then
            grep -iE "error|denied|permission|not found|enable|has not been" out.txt | tail -6 | while IFS= read -r l; do echo "::error::$l"; done
          fi
          rm -f "$RUNNER_TEMP/sa.json"
          exit $code
