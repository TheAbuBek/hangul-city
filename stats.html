<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Team Stats · Hangul City</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<link rel="stylesheet" href="style.css?v=10170209">
<style>
.wide{max-width:880px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.kpi b{display:block;font-family:var(--f-display);font-weight:400;font-size:30px;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:12px}
.panel h2{margin:0;font-size:16px}
.panel .sub{margin:0;font-size:12px;color:var(--muted)}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:110px 1fr 44px;gap:10px;align-items:center;font-size:13px}
.bar .track{height:14px;background:var(--bubble);border-radius:4px;overflow:hidden;display:flex}
.bar .fill{height:100%}
.bar .v{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.cols{display:flex;align-items:flex-end;gap:4px;height:140px;border-bottom:1px solid var(--line);padding-top:16px}
.cols div{flex:1;background:var(--navy);border-radius:3px 3px 0 0;position:relative;min-height:2px}
.cols div span{position:absolute;top:-16px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums}
.colx{display:flex;gap:4px;font-size:10px;color:var(--muted)}
.colx span{flex:1;text-align:center;overflow:hidden;white-space:nowrap}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.demo{background:var(--accent-soft);color:var(--accent);border-radius:10px;padding:10px 12px;font-size:13px;font-weight:700}
table{border-collapse:collapse;width:100%;font-size:13px}
td,th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;font-variant-numeric:tabular-nums}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:500}
.tw{overflow-x:auto}
</style>
</head>
<body>
<div class="app wide" id="app">
  <div class="top"><div><h1>Team stats</h1><p>Hangul City · usage data for PBL Module 2</p></div>
    <a class="back" href="index.html">← App</a></div>
  <div id="status" class="note info">Loading…</div>
  <div id="out" hidden></div>
</div>
<script src="config.js?v=10170209"></script>
<script src="data.js?v=10170209"></script>
<script src="basics.js?v=10170209"></script>
<script>
const ALLP=[];window.CITIES.filter(c=>!c.soon).forEach(c=>c.places.forEach(p=>{if(!ALLP.find(x=>x.code===p.code))ALLP.push({code:p.code,ko:p.ko,city:c.ko});}));
const PL=ALLP.map(p=>p.code), NAMES=Object.fromEntries(ALLP.map(p=>[p.code,p.ko]));
const KIND_LABEL={formal:"Too formal",casual:"Too casual (반말)",rude:"Rude / blunt",meaning:"Wrong meaning",word_order:"Word order",wrong_word:"Wrong word",timeout:"Ran out of time"};
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const pj=s=>{try{return JSON.parse(s);}catch(e){return {};}};

function demoRows(){
  // Clearly fake data so the team can see what the dashboard will look like.
  const rows=[],countries=["Vietnam","China","Uzbekistan","Germany","Mexico","Mongolia","Kazakhstan","France","Indonesia","USA"];
  const lv=["none","beginner","beginner","intermediate","advanced"],mo=["<1","1-6","1-6","6-12"],roles=["student","student","student","worker","other"],homes=["seoul","seoul","busan","incheon","seoul"];
  const seoul=window.CITIES[0].places.map(p=>p.code);
  const start=Date.now()-20*864e5;
  for(let u=0;u<30;u++){
    const uid="demo"+u,nick="Demo"+(u+1),c=countries[u%countries.length],l=lv[u%5],m=mo[(u*3)%4];
    const days=1+Math.floor(Math.random()*9),reach=Math.random();
    let t=start+Math.random()*6*864e5;
    const push=(event,place="",detail="")=>rows.push({time:new Date(t+=6e4).toISOString(),user:uid,nickname:nick,event,place,detail:String(detail),country:c,level:l,months:m});
    push("signup","",JSON.stringify({country:c,role:roles[u%5],home:homes[u%5]}));
    const score=Math.max(0,Math.min(8,{none:1,beginner:3,intermediate:5,advanced:7}[l]+Math.round(Math.random()*3-1.5)));
    const form=u%2?"A":"B", skipped=Math.random()<.2;
    if(skipped)push("placement_skip","","beginner");else push("placement","",`${score}/8:${score>=7?"advanced":score>=4?"intermediate":"beginner"}:${form}`);
    for(let d=0;d<days;d++){
      t+=864e5*(0.6+Math.random()*1.8);push("session_start");
      const i=Math.min(seoul.length-1,1+Math.floor(d*reach*1.3));const code=seoul[i];
      push("place_start",code);
      const errs=Math.floor(Math.random()*4);
      for(let e=0;e<errs;e++)push("answer_wrong",code,["formal","formal","casual","meaning","word_order","rude"][Math.floor(Math.random()*6)]);
      if(Math.random()<.85){push("practice_done",code,errs);
        let sc=0;for(let q=0;q<8;q++){const cur=q<4||i<2;const from=cur?code:seoul[1+Math.floor(Math.random()*Math.max(1,i-1))];const ok=Math.random()<(cur?.85:.65);sc+=ok;push("quiz_answer",code,`${from}:${ok?1:0}:meaning`);}
        push("quiz_done",code,`${sc}/8:${sc>=6?"pass":"fail"}`);
        if(sc>=6&&Math.random()<.55)push("mission_done",code,["yes","yes","partly","partly","no"][Math.floor(Math.random()*5)]);else push("mission_later",code);}
      else push("place_quit",code);
    }
    if(days>=4){const post=Math.min(8,(skipped?2:score)+Math.round(Math.random()*3-0.5));push("posttest","",`${post}/8:pre=${skipped?"none":score}:${form==="A"?"B":"A"}`);}
    if(days>=3&&Math.random()<.7){const r=()=>3+Math.round(Math.random()*2);push("survey","",`easy=${r()}|real=${r()}|confident=${Math.max(1,r()-1)}|recommend=${r()}`);if(u%4===0)push("survey_text","",["More Busan dialect please","Voice is too fast sometimes","Loved the bank lesson","Add Vietnamese menus"][u%4===0?(u/4)%4:0]);}
    if(u%3===0){push("room_join","","1234");for(let q=0;q<10;q++)push("room_answer","",`1234:${Math.random()<.7?1:0}:meaning`);push("room_end","",`1234:${1+u%6}/6:${Math.round(Math.random()*8000)}`);}
  }
  return rows;
}

async function load(){
  const st=document.getElementById("status");
  const url=window.SSK_ENDPOINT;
  if(!url){
    st.innerHTML=`No data source connected yet. Paste the Google Apps Script URL into <code>config.js</code> (see README). <button class="act alt" id="demo" style="display:inline-block;margin-left:8px;padding:6px 12px">Show demo data</button>`;
    document.getElementById("demo").onclick=()=>{st.hidden=true;draw(demoRows(),true);};
    return;
  }
  let key="";try{key=localStorage.getItem("ssk_team_key")||"";}catch(e){}
  if(!key){
    st.innerHTML=`<form id="kf" class="row" style="align-items:center"><span style="flex:1 1 100%">Team password needed to see the data.</span><input id="k" type="password" placeholder="Team password" style="font:inherit;padding:10px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink)"><button class="act" type="submit">Open</button></form>`;
    document.getElementById("kf").onsubmit=ev=>{ev.preventDefault();try{localStorage.setItem("ssk_team_key",document.getElementById("k").value.trim());}catch(e){}load();};
    return;
  }
  try{
    const r=await fetch(url+"?key="+encodeURIComponent(key));const j=await r.json();
    if(j.error==="key"){try{localStorage.removeItem("ssk_team_key");}catch(e){}st.className="note bad";st.textContent="Wrong team password. Reload the page and try again.";return;}
    st.hidden=true;draw(j.rows||[],false);
  }catch(e){
    st.className="note bad";st.textContent="Couldn't load data from the Google Sheet. Check that the Apps Script is deployed with access set to “Anyone”.";
  }
}

function bars(items,max,color){
  return `<div class="bars">${items.map(([label,v,extra])=>`<div class="bar"><span>${label}</span><div class="track"><div class="fill" style="width:${max?100*v/max:0}%;background:${color}"></div></div><span class="v">${extra??v}</span></div>`).join("")}</div>`;
}

function draw(rows,isDemo){
  {const seen=new Set();rows=rows.filter(r=>{const k=r.user+"|"+r.time+"|"+r.event+"|"+r.detail;if(seen.has(k))return false;seen.add(k);return true;});}
  const out=document.getElementById("out");out.hidden=false;
  const users=new Map();
  rows.forEach(r=>{if(!users.has(r.user))users.set(r.user,{days:new Set(),level:r.level,missions:0,tested:"",role:"",home:""});
    const u=users.get(r.user);u.days.add(String(r.time).slice(0,10));if(r.event==="mission_done")u.missions++;if(r.level)u.level=r.level;
    if(r.event==="signup"){const j=pj(r.detail);u.role=j.role||u.role;u.home=j.home||u.home;}
    if(r.event==="placement")u.tested=String(r.detail).split(":")[1]||"";
    if(r.event==="placement_skip")u.tested=u.tested||"beginner (skipped)";
    if(r.event==="placement_override")u.tested=String(r.detail).split("->")[1]+" (chose)";});
  const U=[...users.values()], nUsers=U.length;
  const avgDays=nUsers?U.reduce((a,u)=>a+u.days.size,0)/nUsers:0;
  const returning=U.filter(u=>u.days.size>=2).length;
  const missions=rows.filter(r=>r.event==="mission_done"&&!/away/.test(r.detail));
  const success=missions.length?missions.filter(r=>r.detail.startsWith("yes")).length/missions.length:0;

  const byDay=new Map();rows.forEach(r=>{const d=String(r.time).slice(0,10);if(!byDay.has(d))byDay.set(d,new Set());byDay.get(d).add(r.user);});
  const days=[...byDay.keys()].sort(), dau=days.map(d=>byDay.get(d).size), maxDau=Math.max(1,...dau);

  const cnt=(ev,code,test)=>new Set(rows.filter(r=>r.event===ev&&r.place===code&&(!test||test(r))).map(r=>r.user)).size;
  const funnel=PL.filter(c=>c!=="한글").map(c=>({c,start:cnt("place_start",c),pass:cnt("quiz_done",c,r=>/pass/.test(r.detail)),mis:cnt("mission_done",c)})).filter(f=>f.start>0);
  const maxF=Math.max(1,...funnel.map(f=>f.start));

  const kinds={};rows.filter(r=>r.event==="answer_wrong").forEach(r=>kinds[r.detail]=(kinds[r.detail]||0)+1);
  const kindItems=Object.entries(kinds).sort((a,b)=>b[1]-a[1]).map(([k,v])=>[KIND_LABEL[k]||k,v]), maxK=Math.max(1,...kindItems.map(k=>k[1]));

  const res={yes:0,partly:0,no:0};missions.forEach(r=>{const k=r.detail.split(":")[0];res[k]=(res[k]||0)+1;});const tot=missions.length||1;

  // retention: review-quiz accuracy on the place just learned vs earlier places
  const qa=rows.filter(r=>r.event==="quiz_answer").map(r=>{const [from,ok]=String(r.detail).split(":");return {cur:from===r.place,ok:ok==="1"};});
  const acc=a=>a.length?Math.round(100*a.filter(x=>x.ok).length/a.length):0;
  const qCur=qa.filter(x=>x.cur), qOld=qa.filter(x=>!x.cur);
  const qd=rows.filter(r=>r.event==="quiz_done"), qPass=qd.filter(r=>/pass/.test(r.detail)).length;

  // self-rated vs tested
  const SELF=["none","beginner","intermediate","advanced"], TEST=["beginner","beginner (skipped)","intermediate","advanced"];
  const cross={};U.forEach(u=>{const k=(u.level||"?")+"|"+(u.tested.replace(" (chose)","")||"not tested");cross[k]=(cross[k]||0)+1;});
  const testCols=[...TEST,"not tested"];

  const roles={},homes={};U.forEach(u=>{roles[u.role||"unknown"]=(roles[u.role||"unknown"]||0)+1;homes[u.home||"unknown"]=(homes[u.home||"unknown"]||0)+1;});
  const ra=rows.filter(r=>r.event==="room_answer"), roomGames=new Set(rows.filter(r=>r.event==="room_start"||r.event==="room_end").map(r=>String(r.detail).split(":")[0])).size;
  const roomPlayers=new Set(rows.filter(r=>r.event==="room_join"||r.event==="room_host").map(r=>r.user)).size;

  // learning gain: pre-test (placement) vs post-test, same user
  const pre={},post={},order={};
  rows.forEach(r=>{if(r.event==="placement"){const p=String(r.detail).split(":");pre[r.user]=+p[0].split("/")[0];order[r.user]=p[2]||"A";}
    if(r.event==="posttest")post[r.user]=+String(r.detail).split("/")[0];});
  const paired=Object.keys(post).filter(u=>u in pre);
  const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
  const preAvg=avg(paired.map(u=>pre[u])), postAvg=avg(paired.map(u=>post[u]));
  const gains=paired.map(u=>post[u]-pre[u]);
  const better=gains.filter(g=>g>0).length, same=gains.filter(g=>g===0).length, worse=gains.filter(g=>g<0).length;
  const byOrder=o=>{const us=paired.filter(u=>order[u]===o);return {n:us.length,g:avg(us.map(u=>post[u]-pre[u]))};};
  const oA=byOrder("A"), oB=byOrder("B");
  // survey
  const SQ=[["easy","Easy to use"],["real","Felt like real Korean"],["confident","More confident at these places"],["recommend","Would recommend"]];
  const sv={};SQ.forEach(([k])=>sv[k]=[]);
  rows.filter(r=>r.event==="survey").forEach(r=>String(r.detail).split("|").forEach(kv=>{const [k,v]=kv.split("=");if(sv[k])sv[k].push(+v);}));
  const svN=rows.filter(r=>r.event==="survey").length;
  const texts=rows.filter(r=>r.event==="survey_text").slice(-20).reverse();
  const navy=css("--navy"),ok=css("--ok"),accC=css("--accent"),mut=css("--muted");
  out.innerHTML=`
  ${isDemo?`<div class="demo">DEMO DATA. Randomly generated to preview the dashboard. Not real users.</div>`:""}
  <div class="kpis">
    <div class="kpi"><b>${nUsers}</b><span>users signed up</span></div>
    <div class="kpi"><b>${avgDays.toFixed(1)}</b><span>avg. days active per user</span></div>
    <div class="kpi"><b>${nUsers?Math.round(100*returning/nUsers):0}%</b><span>came back on 2+ days</span></div>
    <div class="kpi"><b>${qd.length?Math.round(100*qPass/qd.length):0}%</b><span>review quizzes passed (n = ${qd.length})</span></div>
    <div class="kpi"><b>${missions.length}</b><span>real-life missions done</span></div>
    <div class="kpi"><b>${Math.round(100*success)}%</b><span>missions understood first try</span></div>
  </div>
  <div class="panel"><h2>Daily active users</h2><p class="sub">Unique users who opened the app each day</p>
    <div class="cols">${dau.map(v=>`<div style="height:${100*v/maxDau}%"><span>${v}</span></div>`).join("")}</div>
    <div class="colx">${days.map((d,i)=>`<span>${i%Math.ceil(days.length/8)===0?d.slice(5):""}</span>`).join("")}</div></div>
  <div class="grid2">
    <div class="panel"><h2>Learning gain</h2><p class="sub">Same users: first level check vs. progress check (8 points each, n = ${paired.length})</p>
      ${bars([["Before",preAvg,preAvg.toFixed(1)+" / 8"],["After",postAvg,postAvg.toFixed(1)+" / 8"]],8,navy)}
      <p class="sub">Average change: <b>${paired.length?(postAvg-preAvg>=0?"+":"")+(postAvg-preAvg).toFixed(1):"–"}</b> points · improved ${better} · same ${same} · lower ${worse}</p>
      <p class="sub">Form check (should be similar): A then B ${oA.n?(oA.g>=0?"+":"")+oA.g.toFixed(1):"–"} (n=${oA.n}) · B then A ${oB.n?(oB.g>=0?"+":"")+oB.g.toFixed(1):"–"} (n=${oB.n})</p></div>
    <div class="panel"><h2>Feedback survey</h2><p class="sub">Average agreement, 1 = disagree, 5 = agree (n = ${svN})</p>
      ${bars(SQ.map(([k,l])=>[l,avg(sv[k]),sv[k].length?avg(sv[k]).toFixed(1):"–"]),5,ok)}
      ${texts.length?`<div class="tw"><table><tr><th>Latest comments</th></tr>${texts.map(t=>`<tr><td>${String(t.detail).replace(/[<>&]/g,"")}</td></tr>`).join("")}</table></div>`:""}</div>
  </div>
  <div class="grid2">
    <div class="panel"><h2>Retention</h2><p class="sub">Review-quiz accuracy: the place just learned vs. places learned earlier</p>
      ${bars([["Just learned",acc(qCur),acc(qCur)+"% (n="+qCur.length+")"],["Learned earlier",acc(qOld),acc(qOld)+"% (n="+qOld.length+")"]],100,ok)}
      <p class="sub">A small drop is normal forgetting. A big drop means earlier places need more review.</p></div>
    <div class="panel"><h2>Self-rated vs. tested level</h2><p class="sub">Rows: what users guessed. Columns: placement result.</p>
      <div class="tw"><table><tr><th>Guessed</th>${testCols.map(t=>`<th>${t}</th>`).join("")}</tr>
      ${SELF.map(sv=>`<tr><td>${sv}</td>${testCols.map(t=>`<td>${cross[sv+"|"+t]||""}</td>`).join("")}</tr>`).join("")}</table></div></div>
  </div>
  <div class="grid2">
    <div class="panel"><h2>How far users get</h2><p class="sub">Users per place: started → passed review quiz → did the real mission</p>
      <div class="legend"><span><i style="background:${navy}"></i>Started</span><span><i style="background:${mut}"></i>Quiz passed</span><span><i style="background:${ok}"></i>Mission done</span></div>
      <div class="bars">${funnel.map(f=>`<div class="bar"><span>${NAMES[f.c]}</span><div class="track" style="flex-direction:column;height:24px;gap:1px;background:none">
        <div class="fill" style="height:8px;width:${100*f.start/maxF}%;background:${navy};border-radius:2px"></div>
        <div class="fill" style="height:7px;width:${100*f.pass/maxF}%;background:${mut};border-radius:2px"></div>
        <div class="fill" style="height:7px;width:${100*f.mis/maxF}%;background:${ok};border-radius:2px"></div></div><span class="v">${f.start}/${f.pass}/${f.mis}</span></div>`).join("")||`<p class="sub">No places started yet.</p>`}</div></div>
    <div class="panel"><h2>What users get wrong</h2><p class="sub">Wrong answers in practice, by type</p>${bars(kindItems,maxK,accC)}</div>
  </div>
  <div class="grid2">
    <div class="panel"><h2>Did Koreans understand them?</h2><p class="sub">Self-report after real-life missions in the user's own city (n = ${missions.length})</p>
      ${bars([["Yes, first try",res.yes,Math.round(100*res.yes/tot)+"%"],["Mostly",res.partly,Math.round(100*res.partly/tot)+"%"],["Switched to English",res.no,Math.round(100*res.no/tot)+"%"]],Math.max(res.yes,res.partly,res.no,1),ok)}</div>
    <div class="panel"><h2>Who uses it</h2><p class="sub">From sign-up</p>
      <div class="tw"><table><tr><th>Role</th><th>Users</th></tr>${Object.entries(roles).map(([k,v])=>`<tr><td>${k}</td><td>${v}</td></tr>`).join("")}</table></div>
      <div class="tw"><table><tr><th>Lives in</th><th>Users</th></tr>${Object.entries(homes).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<tr><td>${k}</td><td>${v}</td></tr>`).join("")}</table></div></div>
  </div>
  <div class="panel"><h2>Competition rooms</h2><p class="sub">${roomGames} game${roomGames===1?"":"s"} · ${roomPlayers} different players · ${acc(ra.map(r=>({ok:String(r.detail).split(":")[1]==="1"})))}% answers correct in games</p></div>
  <div class="row"><button class="act alt" id="csv">Download all events (CSV)</button></div>`;
  document.getElementById("csv").onclick=()=>{
    const H=["time","user","nickname","event","place","detail","country","level","months"];
    const q=v=>`"${String(v??"").replace(/"/g,'""')}"`;
    const csv=[H.join(","),...rows.map(r=>H.map(h=>q(r[h])).join(","))].join("\n");
    const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["﻿"+csv],{type:"text/csv"}));a.download=isDemo?"hangul-city-demo-events.csv":"hangul-city-events.csv";a.click();
  };
}
load();
</script>
</body>
</html>
